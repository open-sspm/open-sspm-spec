"$id": "opensspm.ruleset.schema.yaml"
"$schema": "http://json-schema.org/draft-07/schema#"
"title": "Open SSPM Ruleset"
"description": "Ruleset documents define compliance metadata and Rego-backed automated checks."
"type": "object"
"additionalProperties": false
"required":
  - "schema_version"
  - "kind"
  - "ruleset"
"properties":
  "schema_version":
    "const": 2
    "type": "integer"
  "kind":
    "const": "opensspm.ruleset"
    "type": "string"
  "ruleset":
    "$ref": "#/definitions/ruleset"
"definitions":
  "scope":
    "type": "object"
    "additionalProperties": false
    "required":
      - "kind"
    "properties":
      "kind":
        "enum":
          - "global"
          - "connector_instance"
        "type": "string"
      "connector_kind":
        "type": "string"
        "minLength": 1
  "source":
    "type": "object"
    "additionalProperties": false
    "required":
      - "name"
      - "version"
      - "date"
    "properties":
      "name":
        "type": "string"
        "minLength": 1
      "version":
        "type": "string"
        "minLength": 1
      "date":
        "type": "string"
        "minLength": 1
      "url":
        "type": "string"
  "reference":
    "type": "object"
    "additionalProperties": false
    "required":
      - "url"
    "properties":
      "title":
        "type": "string"
      "url":
        "type": "string"
        "minLength": 1
      "type":
        "enum":
          - "documentation"
          - "standard"
          - "blog"
          - "ticket"
          - "other"
        "type": "string"
  "dataset_contract":
    "type": "object"
    "additionalProperties": false
    "required":
      - "dataset"
      - "version"
    "properties":
      "dataset":
        "type": "string"
        "minLength": 1
      "version":
        "type": "integer"
        "minimum": 1
      "description":
        "type": "string"
  "framework_mapping":
    "type": "object"
    "additionalProperties": false
    "required":
      - "framework"
      - "control"
    "properties":
      "framework":
        "type": "string"
        "minLength": 1
      "control":
        "type": "string"
        "minLength": 1
      "enhancement":
        "type": "string"
      "coverage":
        "enum":
          - "direct"
          - "partial"
          - "supporting"
        "type": "string"
      "notes":
        "type": "string"
  "ruleset_requirements":
    "type": "object"
    "additionalProperties": false
    "properties":
      "api_scopes":
        "type": "array"
        "items":
          "type": "string"
      "permissions":
        "type": "array"
        "items":
          "type": "string"
      "notes":
        "type": "string"
  "rego_policy":
    "type": "object"
    "additionalProperties": false
    "required":
      - "engine"
      - "package"
      - "rego"
    "properties":
      "engine":
        "const": "rego"
        "type": "string"
      "package":
        "type": "string"
        "minLength": 1
      "query":
        "type": "string"
        "minLength": 1
      "rego":
        "type": "string"
        "minLength": 1
  "check":
    "type": "object"
    "additionalProperties": false
    "required":
      - "engine"
      - "query"
    "properties":
      "engine":
        "const": "rego"
        "type": "string"
      "package":
        "type": "string"
        "minLength": 1
      "query":
        "type": "string"
        "minLength": 1
      "rego":
        "type": "string"
        "minLength": 1
  "monitoring":
    "type": "object"
    "additionalProperties": false
    "required":
      - "status"
    "properties":
      "status":
        "enum":
          - "automated"
          - "partial"
          - "manual"
          - "unsupported"
        "type": "string"
      "reason":
        "type": "string"
  "parameter_schema":
    "type": "object"
    "additionalProperties": false
    "required":
      - "type"
    "properties":
      "type":
        "type": "string"
      "description":
        "type": "string"
      "minimum":
        "type": "number"
      "maximum":
        "type": "number"
      "enum":
        "type": "array"
  "parameters":
    "type": "object"
    "additionalProperties": false
    "required":
      - "defaults"
    "properties":
      "defaults":
        "type": "object"
      "schema":
        "type": "object"
        "additionalProperties":
          "$ref": "#/definitions/parameter_schema"
  "affected_resources":
    "type": "object"
    "additionalProperties": false
    "required":
      - "dataset"
      - "id_field"
      - "display_field"
    "properties":
      "dataset":
        "type": "string"
      "id_field":
        "type": "string"
      "display_field":
        "type": "string"
  "evidence":
    "type": "object"
    "additionalProperties": false
    "properties":
      "affected_resources":
        "$ref": "#/definitions/affected_resources"
      "summary_templates":
        "type": "object"
        "additionalProperties":
          "type": "string"
  "remediation":
    "type": "object"
    "additionalProperties": false
    "required":
      - "instructions"
    "properties":
      "instructions":
        "type": "string"
      "risks":
        "type": "string"
      "effort":
        "enum":
          - "low"
          - "medium"
          - "high"
        "type": "string"
  "lifecycle":
    "type": "object"
    "additionalProperties": false
    "properties":
      "rule_version":
        "type": "string"
      "is_active":
        "type": "boolean"
      "replaced_by":
        "type": "string"
  "rule":
    "type": "object"
    "additionalProperties": false
    "required":
      - "key"
      - "title"
      - "severity"
      - "monitoring"
      - "required_data"
    "properties":
      "key":
        "type": "string"
        "minLength": 1
      "title":
        "type": "string"
        "minLength": 1
      "severity":
        "enum":
          - "critical"
          - "high"
          - "medium"
          - "low"
          - "info"
        "type": "string"
      "monitoring":
        "$ref": "#/definitions/monitoring"
      "required_data":
        "type": "array"
        "items":
          "type": "string"
          "minLength": 1
      "summary":
        "type": "string"
      "description":
        "type": "string"
      "category":
        "type": "string"
      "parameters":
        "$ref": "#/definitions/parameters"
      "check":
        "$ref": "#/definitions/check"
      "evidence":
        "$ref": "#/definitions/evidence"
      "remediation":
        "$ref": "#/definitions/remediation"
      "references":
        "type": "array"
        "items":
          "$ref": "#/definitions/reference"
      "framework_mappings":
        "type": "array"
        "items":
          "$ref": "#/definitions/framework_mapping"
      "tags":
        "type": "array"
        "items":
          "type": "string"
      "lifecycle":
        "$ref": "#/definitions/lifecycle"
  "ruleset":
    "type": "object"
    "additionalProperties": false
    "required":
      - "key"
      - "name"
      - "scope"
      - "rules"
    "properties":
      "key":
        "type": "string"
        "minLength": 1
      "name":
        "type": "string"
        "minLength": 1
      "scope":
        "$ref": "#/definitions/scope"
      "source":
        "$ref": "#/definitions/source"
      "status":
        "enum":
          - "draft"
          - "active"
          - "deprecated"
        "type": "string"
      "description":
        "type": "string"
      "tags":
        "type": "array"
        "items":
          "type": "string"
      "references":
        "type": "array"
        "items":
          "$ref": "#/definitions/reference"
      "framework_mappings":
        "type": "array"
        "items":
          "$ref": "#/definitions/framework_mapping"
      "requirements":
        "$ref": "#/definitions/ruleset_requirements"
      "data_contracts":
        "type": "array"
        "items":
          "$ref": "#/definitions/dataset_contract"
      "policy":
        "$ref": "#/definitions/rego_policy"
      "rules":
        "type": "array"
        "items":
          "$ref": "#/definitions/rule"
