"$id": "opensspm.entity_policy_pack.schema.yaml"
"$schema": "http://json-schema.org/draft-07/schema#"
"title": "Open SSPM Entity Policy Pack"
"description": "Entity policy packs evaluate one entity with a Rego module and return risk levels, scores, and signals."
"type": "object"
"additionalProperties": false
"required":
  - "schema_version"
  - "kind"
  - "entity_policy_pack"
"properties":
  "schema_version":
    "const": 2
    "type": "integer"
  "kind":
    "const": "opensspm.entity_policy_pack"
    "type": "string"
  "entity_policy_pack":
    "$ref": "#/definitions/entity_policy_pack"
"definitions":
  "metadata":
    "type": "object"
    "additionalProperties": false
    "required":
      - "id"
      - "version"
      - "domain"
    "properties":
      "id":
        "type": "string"
        "minLength": 1
        "pattern": "^[^:/]+$"
      "version":
        "type": "string"
        "minLength": 1
      "domain":
        "enum":
          - "credential"
          - "identity"
          - "saas"
        "type": "string"
  "inputs":
    "type": "object"
    "additionalProperties": false
    "required":
      - "schema"
    "properties":
      "schema":
        "type": "string"
        "minLength": 1
  "rego_policy":
    "type": "object"
    "additionalProperties": false
    "required":
      - "engine"
      - "package"
      - "query"
    "oneOf":
      - "required":
          - "rego"
      - "required":
          - "rego_path"
    "properties":
      "engine":
        "const": "rego"
        "type": "string"
      "package":
        "type": "string"
        "minLength": 1
      "query":
        "type": "string"
        "minLength": 1
      "rego":
        "type": "string"
        "minLength": 1
      "rego_path":
        "type": "string"
        "minLength": 1
  "entity_policy_pack":
    "type": "object"
    "additionalProperties": false
    "required":
      - "metadata"
      - "inputs"
      - "policy"
    "properties":
      "metadata":
        "$ref": "#/definitions/metadata"
      "inputs":
        "$ref": "#/definitions/inputs"
      "policy":
        "$ref": "#/definitions/rego_policy"
