name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Enforce no tracked JSON files
        run: test -z "$(git ls-files '*.json')"
      - name: Check formatting
        run: |
          out="$(git ls-files '*.go' | xargs gofmt -l)"
          test -z "$out" || { echo "$out"; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Validate specs
        run: go run ./tools/osspec/cmd/osspec validate
      - name: Verify executable specs
        run: go run ./tools/osspec/cmd/osspec verify
      - name: Build dist
        run: go run ./tools/osspec/cmd/osspec build
      - name: Codegen (Go)
        run: go run ./tools/osspec/cmd/osspec codegen --lang go --out gen/go
      - name: Determinism check
        run: git diff --exit-code
      - name: Clean tree check
        run: test -z "$(git status --porcelain)"
