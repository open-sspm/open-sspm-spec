kind: opensspm.ruleset
ruleset:
  data_contracts:
    - dataset: okta:authenticators
      version: 1
    - dataset: okta:log-streams
      version: 1
    - dataset: okta:policies/password
      version: 1
    - dataset: okta:policies/sign-on
      version: 1
  key: cis.okta.idaas_stig.v2
  name: CIS Okta IDaaS STIG Benchmark v1.0.0
  references:
    - title: CIS Benchmarks (obtain the official PDF via CIS)
      url: https://www.cisecurity.org
    - title: 'Severity mapping: CAT I -> high, CAT II -> medium'
      url: https://www.cisecurity.org
  rules:
    - check:
        engine: cel
        expression: rows("okta:policies/sign-on").filter(r, r["policy"]["name"] == "Default Policy" && r["priority"] == 1 && r["name"] != "Default Rule").size() > 0 && rows("okta:policies/sign-on").filter(r, r["policy"]["name"] == "Default Policy" && r["priority"] == 1 && r["name"] != "Default Rule").all(r, r["actions"]["signon"]["session"]["maxSessionIdleMinutes"] == 15)
      key: OKTA-APP-000020
      monitoring:
        status: automated
      references:
        - title: 'Okta Management API: Policy (sign-on policies and rules)'
          type: documentation
          url: https://developer.okta.com/docs/api/openapi/okta-management/management/tag/Policy/
      required_data:
        - okta:policies/sign-on
      severity: medium
      summary: Checks Global Session Policy rule priority 1 idle timeout.
      title: OKTA-APP-000020
    - key: OKTA-APP-000025
      monitoring:
        status: manual
      references:
        - title: 'Okta Management API: OktaApplicationSettings (first-party app settings)'
          type: documentation
          url: https://developer.okta.com/docs/api/openapi/okta-management/management/tag/OktaApplicationSettings/
      required_data: []
      severity: medium
      summary: See CIS benchmark recommendation OKTA-APP-000025
      title: OKTA-APP-000025
    - key: OKTA-APP-000090
      monitoring:
        status: manual
      references:
        - title: 'Okta API: Users (suspend/deactivate user lifecycle)'
          type: documentation
          url: https://developer.okta.com/docs/reference/api/users/
      required_data: []
      severity: medium
      summary: See CIS benchmark recommendation OKTA-APP-000090
      title: OKTA-APP-000090
    - check:
        engine: cel
        expression: rows("okta:policies/password").filter(r, r["status"] == "ACTIVE").size() > 0 && rows("okta:policies/password").filter(r, r["status"] == "ACTIVE").all(r, r["settings"]["password"]["lockout"]["maxAttempts"] == 3)
      key: OKTA-APP-000170
      monitoring:
        status: automated
      references:
        - title: 'Okta Management API: Policy (password policies)'
          type: documentation
          url: https://developer.okta.com/docs/api/openapi/okta-management/management/tag/Policy/
      required_data:
        - okta:policies/password
      severity: medium
      summary: Checks password lockout threshold for active password policies.
      title: OKTA-APP-000170
    - key: OKTA-APP-000180
      monitoring:
        status: manual
      references:
        - title: 'Okta Management API: Policy (authentication policies and rules)'
          type: documentation
          url: https://developer.okta.com/docs/api/openapi/okta-management/management/tag/Policy/
        - title: 'Okta Management API: Authenticator'
          type: documentation
          url: https://developer.okta.com/docs/api/openapi/okta-management/management/tag/Authenticator/
      required_data: []
      severity: medium
      summary: See CIS benchmark recommendation OKTA-APP-000180
      title: OKTA-APP-000180
    - key: OKTA-APP-000190
      monitoring:
        status: manual
      references:
        - title: 'Okta Management API: Policy (authentication policies and rules)'
          type: documentation
          url: https://developer.okta.com/docs/api/openapi/okta-management/management/tag/Policy/
        - title: 'Okta Management API: Authenticator'
          type: documentation
          url: https://developer.okta.com/docs/api/openapi/okta-management/management/tag/Authenticator/
      required_data: []
      severity: medium
      summary: See CIS benchmark recommendation OKTA-APP-000190
      title: OKTA-APP-000190
    - key: OKTA-APP-000200
      monitoring:
        status: manual
      references:
        - title: 'Okta Management API: CustomPages (sign-in page customization)'
          type: documentation
          url: https://developer.okta.com/docs/api/openapi/okta-management/management/tag/CustomPages/
      required_data: []
      severity: medium
      summary: See CIS benchmark recommendation OKTA-APP-000200
      title: OKTA-APP-000200
    - key: OKTA-APP-000560
      monitoring:
        status: manual
      references:
        - title: 'Okta Management API: Policy (authentication policies and rules)'
          type: documentation
          url: https://developer.okta.com/docs/api/openapi/okta-management/management/tag/Policy/
      required_data: []
      severity: high
      summary: See CIS benchmark recommendation OKTA-APP-000560
      title: OKTA-APP-000560
    - key: OKTA-APP-000570
      monitoring:
        status: manual
      references:
        - title: 'Okta Management API: Policy (authentication policies and rules)'
          type: documentation
          url: https://developer.okta.com/docs/api/openapi/okta-management/management/tag/Policy/
      required_data: []
      severity: high
      summary: See CIS benchmark recommendation OKTA-APP-000570
      title: OKTA-APP-000570
    - check:
        engine: cel
        expression: rows("okta:policies/password").filter(r, r["status"] == "ACTIVE").size() > 0 && rows("okta:policies/password").filter(r, r["status"] == "ACTIVE").all(r, r["settings"]["password"]["complexity"]["minLength"] >= 15)
      key: OKTA-APP-000650
      monitoring:
        status: automated
      references:
        - title: 'Okta Management API: Policy (password policies)'
          type: documentation
          url: https://developer.okta.com/docs/api/openapi/okta-management/management/tag/Policy/
      required_data:
        - okta:policies/password
      severity: medium
      summary: Checks password minimum length for active password policies.
      title: OKTA-APP-000650
    - check:
        engine: cel
        expression: rows("okta:policies/password").filter(r, r["status"] == "ACTIVE").size() > 0 && rows("okta:policies/password").filter(r, r["status"] == "ACTIVE").all(r, r["settings"]["password"]["complexity"]["minUpperCase"] >= 1)
      key: OKTA-APP-000670
      monitoring:
        status: automated
      references:
        - title: 'Okta Management API: Policy (password policies)'
          type: documentation
          url: https://developer.okta.com/docs/api/openapi/okta-management/management/tag/Policy/
      required_data:
        - okta:policies/password
      severity: medium
      summary: Checks password uppercase requirement for active password policies.
      title: OKTA-APP-000670
    - check:
        engine: cel
        expression: rows("okta:policies/password").filter(r, r["status"] == "ACTIVE").size() > 0 && rows("okta:policies/password").filter(r, r["status"] == "ACTIVE").all(r, r["settings"]["password"]["complexity"]["minLowerCase"] >= 1)
      key: OKTA-APP-000680
      monitoring:
        status: automated
      references:
        - title: 'Okta Management API: Policy (password policies)'
          type: documentation
          url: https://developer.okta.com/docs/api/openapi/okta-management/management/tag/Policy/
      required_data:
        - okta:policies/password
      severity: medium
      summary: Checks password lowercase requirement for active password policies.
      title: OKTA-APP-000680
    - check:
        engine: cel
        expression: rows("okta:policies/password").filter(r, r["status"] == "ACTIVE").size() > 0 && rows("okta:policies/password").filter(r, r["status"] == "ACTIVE").all(r, r["settings"]["password"]["complexity"]["minNumber"] >= 1)
      key: OKTA-APP-000690
      monitoring:
        status: automated
      references:
        - title: 'Okta Management API: Policy (password policies)'
          type: documentation
          url: https://developer.okta.com/docs/api/openapi/okta-management/management/tag/Policy/
      required_data:
        - okta:policies/password
      severity: medium
      summary: Checks password numeric requirement for active password policies.
      title: OKTA-APP-000690
    - check:
        engine: cel
        expression: rows("okta:policies/password").filter(r, r["status"] == "ACTIVE").size() > 0 && rows("okta:policies/password").filter(r, r["status"] == "ACTIVE").all(r, r["settings"]["password"]["complexity"]["minSymbol"] >= 1)
      key: OKTA-APP-000700
      monitoring:
        status: automated
      references:
        - title: 'Okta Management API: Policy (password policies)'
          type: documentation
          url: https://developer.okta.com/docs/api/openapi/okta-management/management/tag/Policy/
      required_data:
        - okta:policies/password
      severity: medium
      summary: Checks password symbol requirement for active password policies.
      title: OKTA-APP-000700
    - check:
        engine: cel
        expression: rows("okta:policies/password").filter(r, r["status"] == "ACTIVE").size() > 0 && rows("okta:policies/password").filter(r, r["status"] == "ACTIVE").all(r, r["settings"]["password"]["age"]["minAgeMinutes"] >= 1440)
      key: OKTA-APP-000740
      monitoring:
        status: automated
      references:
        - title: 'Okta Management API: Policy (password policies)'
          type: documentation
          url: https://developer.okta.com/docs/api/openapi/okta-management/management/tag/Policy/
      required_data:
        - okta:policies/password
      severity: medium
      summary: Checks password minimum age for active password policies.
      title: OKTA-APP-000740
    - check:
        engine: cel
        expression: rows("okta:policies/password").filter(r, r["status"] == "ACTIVE").size() > 0 && rows("okta:policies/password").filter(r, r["status"] == "ACTIVE").all(r, r["settings"]["password"]["age"]["maxAgeDays"] == 60)
      key: OKTA-APP-000745
      monitoring:
        status: automated
      references:
        - title: 'Okta Management API: Policy (password policies)'
          type: documentation
          url: https://developer.okta.com/docs/api/openapi/okta-management/management/tag/Policy/
      required_data:
        - okta:policies/password
      severity: medium
      summary: Checks password maximum age for active password policies.
      title: OKTA-APP-000745
    - check:
        engine: cel
        expression: rows("okta:log-streams").filter(r, r["status"] == "ACTIVE").size() >= 1
      key: OKTA-APP-001430
      monitoring:
        reason: Okta logs can also be exported via the System Log API; this check only covers Log Streaming.
        status: partial
      references:
        - title: 'Okta Management API: LogStream'
          type: documentation
          url: https://developer.okta.com/docs/api/openapi/okta-management/management/tag/LogStream/
      required_data:
        - okta:log-streams
      severity: high
      summary: Checks that at least one Log Streaming connection is configured and active.
      title: OKTA-APP-001430
    - check:
        engine: cel
        expression: rows("okta:policies/sign-on").filter(r, r["policy"]["name"] == "Default Policy" && r["priority"] == 1 && r["name"] != "Default Rule").size() > 0 && rows("okta:policies/sign-on").filter(r, r["policy"]["name"] == "Default Policy" && r["priority"] == 1 && r["name"] != "Default Rule").all(r, r["actions"]["signon"]["session"]["maxSessionLifetimeMinutes"] == 1080)
      key: OKTA-APP-001665
      monitoring:
        status: automated
      references:
        - title: 'Okta Management API: Policy (sign-on policies and rules)'
          type: documentation
          url: https://developer.okta.com/docs/api/openapi/okta-management/management/tag/Policy/
      required_data:
        - okta:policies/sign-on
      severity: medium
      summary: Checks Global Session Policy rule priority 1 session lifetime.
      title: OKTA-APP-001665
    - check:
        engine: cel
        expression: rows("okta:authenticators").filter(r, r["name"] == "Smart Card Authenticator").size() > 0 && rows("okta:authenticators").filter(r, r["name"] == "Smart Card Authenticator").all(r, r["status"] == "ACTIVE")
      key: OKTA-APP-001670
      monitoring:
        status: automated
      references:
        - title: 'Okta Management API: Authenticator'
          type: documentation
          url: https://developer.okta.com/docs/api/openapi/okta-management/management/tag/Authenticator/
      required_data:
        - okta:authenticators
      severity: medium
      summary: Checks that the Smart Card Authenticator is present and active.
      title: OKTA-APP-001670
    - key: OKTA-APP-001700
      monitoring:
        status: manual
      references:
        - title: 'Okta Management API: Authenticator (Okta Verify settings)'
          type: documentation
          url: https://developer.okta.com/docs/api/openapi/okta-management/management/tag/Authenticator/
      required_data: []
      severity: medium
      summary: See CIS benchmark recommendation OKTA-APP-001700
      title: OKTA-APP-001700
    - check:
        engine: cel
        expression: rows("okta:policies/sign-on").filter(r, r["policy"]["name"] == "Default Policy" && r["priority"] == 1 && r["name"] != "Default Rule").size() > 0 && rows("okta:policies/sign-on").filter(r, r["policy"]["name"] == "Default Policy" && r["priority"] == 1 && r["name"] != "Default Rule").all(r, r["actions"]["signon"]["session"]["usePersistentCookie"] == false)
      key: OKTA-APP-001710
      monitoring:
        status: automated
      references:
        - title: 'Okta Management API: Policy (sign-on policies and rules)'
          type: documentation
          url: https://developer.okta.com/docs/api/openapi/okta-management/management/tag/Policy/
      required_data:
        - okta:policies/sign-on
      severity: medium
      summary: Checks Global Session Policy rule priority 1 persistent cookie setting.
      title: OKTA-APP-001710
    - key: OKTA-APP-001920
      monitoring:
        status: manual
      references:
        - title: 'Okta API: Identity Providers'
          type: documentation
          url: https://developer.okta.com/docs/reference/api/idps/
        - title: 'Okta API: Identity Provider Keys'
          type: documentation
          url: https://developer.okta.com/docs/reference/api/idp-keys/
      required_data: []
      severity: medium
      summary: See CIS benchmark recommendation OKTA-APP-001920
      title: OKTA-APP-001920
    - check:
        engine: cel
        expression: rows("okta:policies/password").filter(r, r["status"] == "ACTIVE").size() > 0 && rows("okta:policies/password").filter(r, r["status"] == "ACTIVE").all(r, r["settings"]["password"]["complexity"]["dictionary"]["common"]["exclude"] == true)
      key: OKTA-APP-002980
      monitoring:
        status: automated
      references:
        - title: 'Okta Management API: Policy (password policies)'
          type: documentation
          url: https://developer.okta.com/docs/api/openapi/okta-management/management/tag/Policy/
      required_data:
        - okta:policies/password
      severity: medium
      summary: Checks common/compromised password protections for active password policies.
      title: OKTA-APP-002980
    - check:
        engine: cel
        expression: rows("okta:policies/password").filter(r, r["status"] == "ACTIVE").size() > 0 && rows("okta:policies/password").filter(r, r["status"] == "ACTIVE").all(r, r["settings"]["password"]["age"]["historyCount"] >= 5)
      key: OKTA-APP-003010
      monitoring:
        status: automated
      references:
        - title: 'Okta Management API: Policy (password policies)'
          type: documentation
          url: https://developer.okta.com/docs/api/openapi/okta-management/management/tag/Policy/
      required_data:
        - okta:policies/password
      severity: medium
      summary: Checks password reuse history for active password policies.
      title: OKTA-APP-003010
  scope:
    connector_kind: okta
    kind: connector_instance
  source:
    date: "2025-08-21"
