kind: opensspm.ruleset
schema_version: 2
ruleset:
  key: cis.okta.idaas_stig.v2
  name: CIS Okta IDaaS STIG Benchmark v1.0.0

  references:
    - title: CIS Benchmarks (obtain the official PDF via CIS)
      url: https://www.cisecurity.org
    - title: "Severity mapping: CAT I -> high, CAT II -> medium"
      url: https://www.cisecurity.org

  data_contracts:
    - dataset: okta:apps/admin-console-settings
      version: 1
    - dataset: okta:authenticators
      version: 1
    - dataset: okta:log-streams
      version: 1
    - dataset: okta:policies/app-signin
      version: 1
    - dataset: okta:policies/password
      version: 1
    - dataset: okta:policies/sign-on
      version: 1

  scope:
    kind: connector_instance
    connector_kind: okta

  source:
    name: CIS
    version: v1.0.0
    date: "2025-08-21"
    url: https://www.cisecurity.org

  status: active
  tags:
    - cis
    - okta
    - stig

  policy:
    engine: rego
    package: opensspm.rules.cis.okta.idaas_stig
    rego_path: cis.okta.idaas_stig.v2.rego
  rules:
    - key: OKTA-APP-000020
      title: OKTA-APP-000020
      severity: medium
      summary: Global Session Policy idle timeout is 15 minutes for the Priority 1 rule in Default Policy.
      monitoring:
        status: automated
      required_data:
        - okta:policies/sign-on
      check:
        engine: rego
        query: 'data.opensspm.rules.cis.okta.idaas_stig.results["OKTA-APP-000020"]'

    - key: OKTA-APP-000025
      title: OKTA-APP-000025
      severity: medium
      summary: Okta Admin Console application session idle timeout is 15 minutes.
      monitoring:
        status: automated
      required_data:
        - okta:apps/admin-console-settings
      check:
        engine: rego
        query: 'data.opensspm.rules.cis.okta.idaas_stig.results["OKTA-APP-000025"]'

    - key: OKTA-APP-000090
      title: OKTA-APP-000090
      severity: medium
      summary: Users are automatically disabled after 35 days of inactivity (workflow/automation).
      monitoring:
        status: manual
      required_data: []

    - key: OKTA-APP-000170
      title: OKTA-APP-000170
      severity: medium
      summary: Password policies lock out after 3 unsuccessful attempts.
      monitoring:
        status: automated
      required_data:
        - okta:policies/password
      check:
        engine: rego
        query: 'data.opensspm.rules.cis.okta.idaas_stig.results["OKTA-APP-000170"]'

    - key: OKTA-APP-000180
      title: OKTA-APP-000180
      severity: medium
      summary: Okta Dashboard authentication policy requires phishing-resistant authenticators.
      monitoring:
        status: automated
      required_data:
        - okta:policies/app-signin
      check:
        engine: rego
        query: 'data.opensspm.rules.cis.okta.idaas_stig.results["OKTA-APP-000180"]'

    - key: OKTA-APP-000190
      title: OKTA-APP-000190
      severity: medium
      summary: Okta Admin Console authentication policy requires phishing-resistant authenticators.
      monitoring:
        status: automated
      required_data:
        - okta:policies/app-signin
      check:
        engine: rego
        query: 'data.opensspm.rules.cis.okta.idaas_stig.results["OKTA-APP-000190"]'

    - key: OKTA-APP-000200
      title: OKTA-APP-000200
