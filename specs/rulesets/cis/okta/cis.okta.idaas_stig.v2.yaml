kind: opensspm.ruleset
schema_version: 2
ruleset:
  key: cis.okta.idaas_stig.v2
  name: CIS Okta IDaaS STIG Benchmark v1.0.0

  references:
    - title: CIS Benchmarks (obtain the official PDF via CIS)
      url: https://www.cisecurity.org
    - title: "Severity mapping: CAT I -> high, CAT II -> medium"
      url: https://www.cisecurity.org

  data_contracts:
    - dataset: okta:apps/admin-console-settings
      version: 1
    - dataset: okta:authenticators
      version: 1
    - dataset: okta:log-streams
      version: 1
    - dataset: okta:policies/app-signin
      version: 1
    - dataset: okta:policies/password
      version: 1
    - dataset: okta:policies/sign-on
      version: 1

  scope:
    kind: connector_instance
    connector_kind: okta

  source:
    name: CIS
    version: v1.0.0
    date: "2025-08-21"
    url: https://www.cisecurity.org

  status: active
  tags:
    - cis
    - okta
    - stig

  policy:
    engine: rego
    package: opensspm.rules.cis.okta.idaas_stig
    rego: |
      package opensspm.rules.cis.okta.idaas_stig

      signon_dataset := "okta:policies/sign-on"
      admin_settings_dataset := "okta:apps/admin-console-settings"
      password_dataset := "okta:policies/password"
      app_signin_dataset := "okta:policies/app-signin"
      log_streams_dataset := "okta:log-streams"
      authenticators_dataset := "okta:authenticators"

      dataset_ok(dataset) if {
        object.get(input.datasets, dataset, null) != null
        object.get(object.get(input.datasets, dataset, {}), "error", null) == null
      }

      rows(dataset) := object.get(object.get(input.datasets, dataset, {}), "rows", [])

      dataset_error_result(dataset) := {"status": "unknown", "reason_code": "dataset_missing_dataset"} if {
        object.get(input.datasets, dataset, null) == null
      }

      dataset_error_result(dataset) := {"status": "unknown", "reason_code": sprintf("dataset_%s", [kind])} if {
        entry := object.get(input.datasets, dataset, {})
        err := object.get(entry, "error", null)
        err != null
        kind := object.get(err, "kind", "engine_error")
      }

      field_result(selected, _, _, on_empty) := {
        "status": "unknown",
        "reason_code": "empty_selection",
        "selected_count": 0,
        "passed_count": 0,
        "count_value": 0,
      } if {
        count(selected) == 0
        on_empty == "unknown"
      }

      field_result(selected, _, _, on_empty) := {
        "status": "fail",
        "reason_code": "empty_selection",
        "selected_count": 0,
        "passed_count": 0,
        "count_value": 0,
      } if {
        count(selected) == 0
        on_empty != "unknown"
      }

      field_result(selected, _, min_selected, _) := {
        "status": "fail",
        "reason_code": "min_selected_not_met",
        "selected_count": count(selected),
        "passed_count": 0,
        "count_value": count(selected),
        "target_value": min_selected,
      } if {
        count(selected) > 0
        count(selected) < min_selected
      }

      field_result(selected, passed, min_selected, _) := {
        "status": "pass",
        "selected_count": count(selected),
        "passed_count": count(passed),
        "count_value": count(passed),
      } if {
        count(selected) >= min_selected
        count(passed) == count(selected)
      }

      field_result(selected, passed, min_selected, _) := {
        "status": "fail",
        "selected_count": count(selected),
        "passed_count": count(passed),
        "count_value": count(passed),
      } if {
        count(selected) >= min_selected
        count(passed) != count(selected)
      }

      count_result(selected, target) := {
        "status": "pass",
        "selected_count": count(selected),
        "passed_count": 1,
        "count_value": count(selected),
        "target_value": target,
      } if {
        count(selected) >= target
      }

      count_result(selected, target) := {
        "status": "fail",
        "selected_count": count(selected),
        "passed_count": 0,
        "count_value": count(selected),
        "target_value": target,
      } if {
        count(selected) < target
      }

      signon_default_priority1 := [r |
        r := rows(signon_dataset)[_]
        r.policy.name == "Default Policy"
        r.priority == 1
        r.name != "Default Rule"
      ]

      active_password_policies := [r |
        r := rows(password_dataset)[_]
        r.status == "ACTIVE"
      ]

      active_log_streams := [r |
        r := rows(log_streams_dataset)[_]
        r.status == "ACTIVE"
      ]

      app_policies(label) := [r |
        r := rows(app_signin_dataset)[_]
        label in object.get(r, "app_labels", [])
      ]

      authenticator_by_name(name) := [r |
        r := rows(authenticators_dataset)[_]
        r.name == name
      ]

      results["OKTA-APP-000020"] := dataset_error_result(signon_dataset) if { not dataset_ok(signon_dataset) }
      results["OKTA-APP-000020"] := field_result(signon_default_priority1, passed, 1, "fail") if {
        dataset_ok(signon_dataset)
        passed := [r | r := signon_default_priority1[_]; r.actions.signon.session.maxSessionIdleMinutes == 15]
      }

      results["OKTA-APP-000025"] := dataset_error_result(admin_settings_dataset) if { not dataset_ok(admin_settings_dataset) }
      results["OKTA-APP-000025"] := field_result(selected, passed, 1, "unknown") if {
        dataset_ok(admin_settings_dataset)
        selected := rows(admin_settings_dataset)
        passed := [r | r := selected[_]; r.session_idle_timeout_minutes == 15]
      }

      results["OKTA-APP-000170"] := dataset_error_result(password_dataset) if { not dataset_ok(password_dataset) }
      results["OKTA-APP-000170"] := field_result(active_password_policies, passed, 1, "unknown") if {
        dataset_ok(password_dataset)
        passed := [r | r := active_password_policies[_]; r.settings.password.lockout.maxAttempts == 3]
      }

      results["OKTA-APP-000180"] := dataset_error_result(app_signin_dataset) if { not dataset_ok(app_signin_dataset) }
      results["OKTA-APP-000180"] := field_result(app_policies("Okta Dashboard"), passed, 1, "fail") if {
        dataset_ok(app_signin_dataset)
        passed := [r | r := app_policies("Okta Dashboard")[_]; r.requires_phishing_resistant == true]
      }

      results["OKTA-APP-000190"] := dataset_error_result(app_signin_dataset) if { not dataset_ok(app_signin_dataset) }
      results["OKTA-APP-000190"] := field_result(app_policies("Okta Admin Console"), passed, 1, "fail") if {
        dataset_ok(app_signin_dataset)
        passed := [r | r := app_policies("Okta Admin Console")[_]; r.requires_phishing_resistant == true]
      }

      results["OKTA-APP-000560"] := dataset_error_result(app_signin_dataset) if { not dataset_ok(app_signin_dataset) }
      results["OKTA-APP-000560"] := field_result(app_policies("Okta Admin Console"), passed, 1, "fail") if {
        dataset_ok(app_signin_dataset)
        passed := [r | r := app_policies("Okta Admin Console")[_]; r.requires_mfa == true]
      }

      results["OKTA-APP-000570"] := dataset_error_result(app_signin_dataset) if { not dataset_ok(app_signin_dataset) }
      results["OKTA-APP-000570"] := field_result(app_policies("Okta Dashboard"), passed, 1, "fail") if {
        dataset_ok(app_signin_dataset)
        passed := [r | r := app_policies("Okta Dashboard")[_]; r.requires_mfa == true]
      }

      results["OKTA-APP-000650"] := dataset_error_result(password_dataset) if { not dataset_ok(password_dataset) }
      results["OKTA-APP-000650"] := field_result(active_password_policies, passed, 1, "unknown") if {
        dataset_ok(password_dataset)
        passed := [r | r := active_password_policies[_]; r.settings.password.complexity.minLength >= 15]
      }

      results["OKTA-APP-000670"] := dataset_error_result(password_dataset) if { not dataset_ok(password_dataset) }
      results["OKTA-APP-000670"] := field_result(active_password_policies, passed, 1, "unknown") if {
        dataset_ok(password_dataset)
        passed := [r | r := active_password_policies[_]; r.settings.password.complexity.minUpperCase >= 1]
      }

      results["OKTA-APP-000680"] := dataset_error_result(password_dataset) if { not dataset_ok(password_dataset) }
      results["OKTA-APP-000680"] := field_result(active_password_policies, passed, 1, "unknown") if {
        dataset_ok(password_dataset)
        passed := [r | r := active_password_policies[_]; r.settings.password.complexity.minLowerCase >= 1]
      }

      results["OKTA-APP-000690"] := dataset_error_result(password_dataset) if { not dataset_ok(password_dataset) }
      results["OKTA-APP-000690"] := field_result(active_password_policies, passed, 1, "unknown") if {
        dataset_ok(password_dataset)
        passed := [r | r := active_password_policies[_]; r.settings.password.complexity.minNumber >= 1]
      }

      results["OKTA-APP-000700"] := dataset_error_result(password_dataset) if { not dataset_ok(password_dataset) }
      results["OKTA-APP-000700"] := field_result(active_password_policies, passed, 1, "unknown") if {
        dataset_ok(password_dataset)
        passed := [r | r := active_password_policies[_]; r.settings.password.complexity.minSymbol >= 1]
      }

      results["OKTA-APP-000740"] := dataset_error_result(password_dataset) if { not dataset_ok(password_dataset) }
      results["OKTA-APP-000740"] := field_result(active_password_policies, passed, 1, "unknown") if {
        dataset_ok(password_dataset)
        passed := [r | r := active_password_policies[_]; r.settings.password.age.minAgeMinutes >= 1440]
      }

      results["OKTA-APP-000745"] := dataset_error_result(password_dataset) if { not dataset_ok(password_dataset) }
      results["OKTA-APP-000745"] := field_result(active_password_policies, passed, 1, "unknown") if {
        dataset_ok(password_dataset)
        passed := [r | r := active_password_policies[_]; r.settings.password.age.maxAgeDays == 60]
      }

      results["OKTA-APP-001430"] := dataset_error_result(log_streams_dataset) if { not dataset_ok(log_streams_dataset) }
      results["OKTA-APP-001430"] := count_result(active_log_streams, 1) if { dataset_ok(log_streams_dataset) }

      results["OKTA-APP-001665"] := dataset_error_result(signon_dataset) if { not dataset_ok(signon_dataset) }
      results["OKTA-APP-001665"] := field_result(signon_default_priority1, passed, 1, "fail") if {
        dataset_ok(signon_dataset)
        passed := [r | r := signon_default_priority1[_]; r.actions.signon.session.maxSessionLifetimeMinutes == 1080]
      }

      results["OKTA-APP-001670"] := dataset_error_result(authenticators_dataset) if { not dataset_ok(authenticators_dataset) }
      results["OKTA-APP-001670"] := field_result(authenticator_by_name("Smart Card Authenticator"), passed, 1, "fail") if {
        dataset_ok(authenticators_dataset)
        passed := [r | r := authenticator_by_name("Smart Card Authenticator")[_]; r.status == "ACTIVE"]
      }

      results["OKTA-APP-001700"] := dataset_error_result(authenticators_dataset) if { not dataset_ok(authenticators_dataset) }
      results["OKTA-APP-001700"] := field_result(authenticator_by_name("Okta Verify"), passed, 1, "fail") if {
        dataset_ok(authenticators_dataset)
        passed := [r | r := authenticator_by_name("Okta Verify")[_]; r.okta_verify_compliance_fips == "REQUIRED"]
      }

      results["OKTA-APP-001710"] := dataset_error_result(signon_dataset) if { not dataset_ok(signon_dataset) }
      results["OKTA-APP-001710"] := field_result(signon_default_priority1, passed, 1, "fail") if {
        dataset_ok(signon_dataset)
        passed := [r | r := signon_default_priority1[_]; r.actions.signon.session.usePersistentCookie == false]
      }

      results["OKTA-APP-002980"] := dataset_error_result(password_dataset) if { not dataset_ok(password_dataset) }
      results["OKTA-APP-002980"] := field_result(active_password_policies, passed, 1, "unknown") if {
        dataset_ok(password_dataset)
        passed := [r | r := active_password_policies[_]; r.settings.password.complexity.dictionary.common.exclude == true]
      }

      results["OKTA-APP-003010"] := dataset_error_result(password_dataset) if { not dataset_ok(password_dataset) }
      results["OKTA-APP-003010"] := field_result(active_password_policies, passed, 1, "unknown") if {
        dataset_ok(password_dataset)
        passed := [r | r := active_password_policies[_]; r.settings.password.age.historyCount >= 5]
      }

  rules:
    - key: OKTA-APP-000020
      title: OKTA-APP-000020
      severity: medium
      summary: Global Session Policy idle timeout is 15 minutes for the Priority 1 rule in Default Policy.
      monitoring:
        status: automated
      required_data:
        - okta:policies/sign-on
      check:
        engine: rego
        query: 'data.opensspm.rules.cis.okta.idaas_stig.results["OKTA-APP-000020"]'

    - key: OKTA-APP-000025
      title: OKTA-APP-000025
      severity: medium
      summary: Okta Admin Console application session idle timeout is 15 minutes.
      monitoring:
        status: automated
      required_data:
        - okta:apps/admin-console-settings
      check:
        engine: rego
        query: 'data.opensspm.rules.cis.okta.idaas_stig.results["OKTA-APP-000025"]'

    - key: OKTA-APP-000090
      title: OKTA-APP-000090
      severity: medium
      summary: Users are automatically disabled after 35 days of inactivity (workflow/automation).
      monitoring:
        status: manual
      required_data: []

    - key: OKTA-APP-000170
      title: OKTA-APP-000170
      severity: medium
      summary: Password policies lock out after 3 unsuccessful attempts.
      monitoring:
        status: automated
      required_data:
        - okta:policies/password
      check:
        engine: rego
        query: 'data.opensspm.rules.cis.okta.idaas_stig.results["OKTA-APP-000170"]'

    - key: OKTA-APP-000180
      title: OKTA-APP-000180
      severity: medium
      summary: Okta Dashboard authentication policy requires phishing-resistant authenticators.
      monitoring:
        status: automated
      required_data:
        - okta:policies/app-signin
      check:
        engine: rego
        query: 'data.opensspm.rules.cis.okta.idaas_stig.results["OKTA-APP-000180"]'

    - key: OKTA-APP-000190
      title: OKTA-APP-000190
      severity: medium
      summary: Okta Admin Console authentication policy requires phishing-resistant authenticators.
      monitoring:
        status: automated
      required_data:
        - okta:policies/app-signin
      check:
        engine: rego
        query: 'data.opensspm.rules.cis.okta.idaas_stig.results["OKTA-APP-000190"]'

    - key: OKTA-APP-000200
      title: OKTA-APP-000200
      severity: medium
      summary: DoD notice and consent banner is displayed before login.
      monitoring:
        status: manual
      required_data: []

    - key: OKTA-APP-000560
      title: OKTA-APP-000560
      severity: high
      summary: Okta Admin Console requires multi-factor authentication.
      monitoring:
        status: automated
      required_data:
        - okta:policies/app-signin
      check:
        engine: rego
        query: 'data.opensspm.rules.cis.okta.idaas_stig.results["OKTA-APP-000560"]'

    - key: OKTA-APP-000570
      title: OKTA-APP-000570
      severity: high
      summary: Okta Dashboard requires multi-factor authentication.
      monitoring:
        status: automated
      required_data:
        - okta:policies/app-signin
      check:
        engine: rego
        query: 'data.opensspm.rules.cis.okta.idaas_stig.results["OKTA-APP-000570"]'

    - key: OKTA-APP-000650
      title: OKTA-APP-000650
      severity: medium
      summary: Password minimum length is at least 15 characters.
      monitoring:
        status: automated
      required_data:
        - okta:policies/password
      check:
        engine: rego
        query: 'data.opensspm.rules.cis.okta.idaas_stig.results["OKTA-APP-000650"]'

    - key: OKTA-APP-000670
      title: OKTA-APP-000670
      severity: medium
      summary: Password requires at least 1 uppercase character.
      monitoring:
        status: automated
      required_data:
        - okta:policies/password
      check:
        engine: rego
        query: 'data.opensspm.rules.cis.okta.idaas_stig.results["OKTA-APP-000670"]'

    - key: OKTA-APP-000680
      title: OKTA-APP-000680
      severity: medium
      summary: Password requires at least 1 lowercase character.
      monitoring:
        status: automated
      required_data:
        - okta:policies/password
      check:
        engine: rego
        query: 'data.opensspm.rules.cis.okta.idaas_stig.results["OKTA-APP-000680"]'

    - key: OKTA-APP-000690
      title: OKTA-APP-000690
      severity: medium
      summary: Password requires at least 1 numeric character.
      monitoring:
        status: automated
      required_data:
        - okta:policies/password
      check:
        engine: rego
        query: 'data.opensspm.rules.cis.okta.idaas_stig.results["OKTA-APP-000690"]'

    - key: OKTA-APP-000700
      title: OKTA-APP-000700
      severity: medium
      summary: Password requires at least 1 symbol character.
      monitoring:
        status: automated
      required_data:
        - okta:policies/password
      check:
        engine: rego
        query: 'data.opensspm.rules.cis.okta.idaas_stig.results["OKTA-APP-000700"]'

    - key: OKTA-APP-000740
      title: OKTA-APP-000740
      severity: medium
      summary: Minimum password age is at least 24 hours.
      monitoring:
        status: automated
      required_data:
        - okta:policies/password
      check:
        engine: rego
        query: 'data.opensspm.rules.cis.okta.idaas_stig.results["OKTA-APP-000740"]'

    - key: OKTA-APP-000745
      title: OKTA-APP-000745
      severity: medium
      summary: Maximum password age is 60 days.
      monitoring:
        status: automated
      required_data:
        - okta:policies/password
      check:
        engine: rego
        query: 'data.opensspm.rules.cis.okta.idaas_stig.results["OKTA-APP-000745"]'

    - key: OKTA-APP-001430
      title: OKTA-APP-001430
      severity: high
      summary: At least one active Log Stream is configured.
      monitoring:
        status: automated
      required_data:
        - okta:log-streams
      check:
        engine: rego
        query: 'data.opensspm.rules.cis.okta.idaas_stig.results["OKTA-APP-001430"]'

    - key: OKTA-APP-001665
      title: OKTA-APP-001665
      severity: medium
      summary: Maximum global session lifetime is 18 hours for the Priority 1 rule in Default Policy.
      monitoring:
        status: automated
      required_data:
        - okta:policies/sign-on
      check:
        engine: rego
        query: 'data.opensspm.rules.cis.okta.idaas_stig.results["OKTA-APP-001665"]'

    - key: OKTA-APP-001670
      title: OKTA-APP-001670
      severity: medium
      summary: Smart Card Authenticator is present and active.
      monitoring:
        status: automated
      required_data:
        - okta:authenticators
      check:
        engine: rego
        query: 'data.opensspm.rules.cis.okta.idaas_stig.results["OKTA-APP-001670"]'

    - key: OKTA-APP-001700
      title: OKTA-APP-001700
      severity: medium
      summary: Okta Verify is configured with FIPS-compliant device enforcement (org-defined).
      monitoring:
        status: automated
      required_data:
        - okta:authenticators
      check:
        engine: rego
        query: 'data.opensspm.rules.cis.okta.idaas_stig.results["OKTA-APP-001700"]'

    - key: OKTA-APP-001710
      title: OKTA-APP-001710
      severity: medium
      summary: Persistent global session cookies are disabled for the Priority 1 rule in Default Policy.
      monitoring:
        status: automated
      required_data:
        - okta:policies/sign-on
      check:
        engine: rego
        query: 'data.opensspm.rules.cis.okta.idaas_stig.results["OKTA-APP-001710"]'

    - key: OKTA-APP-001920
      title: OKTA-APP-001920
      severity: medium
      summary: Smart Card IdPs are active and use DoD-approved certificate authorities.
      monitoring:
        status: manual
      required_data: []

    - key: OKTA-APP-002980
      title: OKTA-APP-002980
      severity: medium
      summary: Common password check is enabled in password policies.
      monitoring:
        status: automated
      required_data:
        - okta:policies/password
      check:
        engine: rego
        query: 'data.opensspm.rules.cis.okta.idaas_stig.results["OKTA-APP-002980"]'

    - key: OKTA-APP-003010
      title: OKTA-APP-003010
      severity: medium
      summary: Password history prevents reuse for at least 5 generations.
      monitoring:
        status: automated
      required_data:
        - okta:policies/password
      check:
        engine: rego
        query: 'data.opensspm.rules.cis.okta.idaas_stig.results["OKTA-APP-003010"]'
