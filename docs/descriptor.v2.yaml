            "dataset": "okta:policies/sign-on"
            "version": 1
        "key": "cis.okta.idaas_stig.v2"
        "name": "CIS Okta IDaaS STIG Benchmark v1.0.0"
        "references":
          -
            "title": "CIS Benchmarks (obtain the official PDF via CIS)"
            "type": "other"
            "url": "https://www.cisecurity.org"
          -
            "title": "Severity mapping: CAT I -\u003e high, CAT II -\u003e medium"
            "type": "other"
            "url": "https://www.cisecurity.org"
        "rules":
          -
            "check":
              "engine": "cel"
              "expression": "rows(\"okta:policies/sign-on\").filter(r, field(r, \"policy.name\") == \"Default Policy\" \u0026\u0026 field(r, \"priority\") == 1 \u0026\u0026 field(r, \"name\") != \"Default Rule\").size() \u003e= 1 \u0026\u0026 rows(\"okta:policies/sign-on\").filter(r, field(r, \"policy.name\") == \"Default Policy\" \u0026\u0026 field(r, \"priority\") == 1 \u0026\u0026 field(r, \"name\") != \"Default Rule\").all(r, field(r, \"actions.signon.session.maxSessionIdleMinutes\") == 15)"
            "key": "OKTA-APP-000020"
            "monitoring":
              "status": "automated"
            "required_data":
              - "okta:policies/sign-on"
            "severity": "medium"
            "summary": "Global Session Policy idle timeout is 15 minutes for the Priority 1 rule in Default Policy."
            "title": "OKTA-APP-000020"
          -
            "check":
              "engine": "cel_plan"
              "plan":
                "assert_expression": "field(r, \"session_idle_timeout_minutes\") == 15"
                "dataset": "okta:apps/admin-console-settings"
                "expect":
                  "match": "all"
                  "min_selected": 1
                  "on_empty": "unknown"
                "on_missing_dataset": "unknown"
                "on_permission_denied": "unknown"
                "on_sync_error": "error"
                "type": "dataset.field_compare"
                "where_expression": "true"
            "key": "OKTA-APP-000025"
            "monitoring":
              "status": "automated"
            "required_data":
              - "okta:apps/admin-console-settings"
            "severity": "medium"
            "summary": "Okta Admin Console application session idle timeout is 15 minutes."
            "title": "OKTA-APP-000025"
          -
            "key": "OKTA-APP-000090"
            "monitoring":
              "status": "manual"
            "required_data": []
            "severity": "medium"
            "summary": "Users are automatically disabled after 35 days of inactivity (workflow/automation)."
            "title": "OKTA-APP-000090"
          -
            "check":
              "engine": "cel_plan"
              "plan":
