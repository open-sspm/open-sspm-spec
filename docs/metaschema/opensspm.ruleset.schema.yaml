"$id": "opensspm.ruleset.schema.yaml"
"$schema": "http://json-schema.org/draft-07/schema#"
"title": "Open SSPM Ruleset"
"description": "Ruleset documents define compliance metadata and Rego-backed automated checks."
"type": "object"
"additionalProperties": false
"required":
  - "schema_version"
  - "kind"
  - "ruleset"
"properties":
  "schema_version":
    "const": 2
    "type": "integer"
  "kind":
    "const": "opensspm.ruleset"
    "type": "string"
  "ruleset":
    "$ref": "#/definitions/ruleset"
"definitions":
  "scope":
    "type": "object"
    "additionalProperties": false
    "required":
      - "kind"
    "properties":
      "kind":
        "enum":
          - "global"
          - "connector_instance"
        "type": "string"
      "connector_kind":
        "type": "string"
        "minLength": 1
  "source":
    "type": "object"
    "additionalProperties": false
    "required":
      - "name"
      - "version"
      - "date"
    "properties":
      "name":
        "type": "string"
        "minLength": 1
      "version":
        "type": "string"
        "minLength": 1
      "date":
        "type": "string"
        "minLength": 1
      "url":
        "type": "string"
        "format": "uri"
  "reference":
    "type": "object"
    "additionalProperties": false
    "required":
      - "url"
    "properties":
      "title":
        "type": "string"
      "url":
        "type": "string"
        "format": "uri"
        "minLength": 1
      "type":
        "enum":
          - "documentation"
          - "standard"
          - "blog"
          - "ticket"
          - "other"
        "type": "string"
  "dataset_contract":
    "type": "object"
    "additionalProperties": false
    "required":
      - "dataset"
      - "version"
    "properties":
      "dataset":
        "type": "string"
        "minLength": 1
      "version":
        "type": "integer"
        "minimum": 1
      "description":
        "type": "string"
  "rego_policy":
    "type": "object"
    "additionalProperties": false
    "required":
      - "engine"
      - "package"
    "oneOf":
      - "required":
          - "rego"
      - "required":
          - "rego_path"
    "properties":
      "engine":
        "const": "rego"
        "type": "string"
      "package":
        "type": "string"
        "minLength": 1
      "query":
        "type": "string"
        "minLength": 1
      "rego":
        "type": "string"
        "minLength": 1
      "rego_path":
        "type": "string"
        "minLength": 1
  "check":
    "type": "object"
    "additionalProperties": false
    "required":
      - "engine"
      - "query"
    "not":
      "required":
        - "rego"
        - "rego_path"
    "properties":
      "engine":
        "const": "rego"
        "type": "string"
      "package":
        "type": "string"
        "minLength": 1
      "query":
        "type": "string"
        "minLength": 1
      "rego":
        "type": "string"
        "minLength": 1
      "rego_path":
        "type": "string"
        "minLength": 1
  "monitoring":
    "type": "object"
    "additionalProperties": false
    "required":
      - "status"
    "properties":
      "status":
        "enum":
          - "automated"
          - "partial"
          - "manual"
          - "unsupported"
        "type": "string"
      "reason":
        "type": "string"
  "rule":
    "type": "object"
    "additionalProperties": false
    "required":
      - "key"
      - "title"
      - "severity"
      - "monitoring"
      - "required_data"
    "properties":
      "key":
        "type": "string"
        "minLength": 1
      "title":
        "type": "string"
        "minLength": 1
      "severity":
        "enum":
          - "critical"
          - "high"
          - "medium"
          - "low"
          - "info"
        "type": "string"
      "monitoring":
        "$ref": "#/definitions/monitoring"
      "required_data":
        "type": "array"
        "items":
          "type": "string"
          "minLength": 1
      "summary":
        "type": "string"
      "description":
        "type": "string"
      "category":
        "type": "string"
      "parameters":
        "description": "Default values exposed to Rego as input.params. Test cases may override them."
        "type": "object"
      "check":
        "$ref": "#/definitions/check"
      "references":
        "type": "array"
        "items":
          "$ref": "#/definitions/reference"
      "tags":
        "type": "array"
        "items":
          "type": "string"
  "ruleset":
    "type": "object"
    "additionalProperties": false
    "required":
      - "key"
      - "name"
      - "scope"
      - "rules"
    "properties":
      "key":
        "type": "string"
        "minLength": 1
      "name":
        "type": "string"
        "minLength": 1
      "scope":
        "$ref": "#/definitions/scope"
      "source":
        "$ref": "#/definitions/source"
      "status":
        "enum":
          - "draft"
          - "active"
          - "deprecated"
        "type": "string"
      "description":
        "type": "string"
      "tags":
        "type": "array"
        "items":
          "type": "string"
      "references":
        "type": "array"
        "items":
          "$ref": "#/definitions/reference"
      "data_contracts":
        "type": "array"
        "items":
          "$ref": "#/definitions/dataset_contract"
      "policy":
        "$ref": "#/definitions/rego_policy"
      "rules":
        "type": "array"
        "items":
          "$ref": "#/definitions/rule"
